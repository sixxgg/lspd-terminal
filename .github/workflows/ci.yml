name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis de api/ y lib/
        run: for f in api/*.js lib/*.js dev/server.mjs; do node --check "$f"; done
      - name: Tipos y build de la app
        run: cd app && npm ci && npm run build
        env:
          OUT: ${{ runner.temp }}/next
